name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "api/dns-gate.openapi.yaml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Publish the OpenAPI spec next to the site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp api/dns-gate.openapi.yaml _site/dns-gate.openapi.yaml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
