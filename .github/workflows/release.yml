name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kamorionlabs/dns-gate
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: package and push the chart to GHCR (OCI)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v="${VERSION#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/dns-gate --version "$v" --app-version "$v"
          helm push "dns-gate-$v.tgz" oci://ghcr.io/kamorionlabs/charts

  lambda:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the UI (embedded in the binary)
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: build the Lambda zip (bootstrap, provided.al2023, arm64)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make lambda VERSION="$VERSION"
      - name: attach the zip and its sha256 to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          zip="dist/dns-gate_${VERSION#v}_lambda_arm64.zip"
          (cd dist && sha256sum -c "$(basename "$zip").sha256")
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag
          gh release upload "$VERSION" "$zip" "$zip.sha256" --clobber
