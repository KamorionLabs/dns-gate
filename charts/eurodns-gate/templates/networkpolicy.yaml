{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eurodns-gate.fullname" . }}
  labels:
    {{- include "eurodns-gate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "eurodns-gate.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 443, protocol: TCP}
      to:
        {{- range .Values.networkPolicy.egressCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- if eq (include "eurodns-gate.storeType" .) "postgres" }}
    - ports:
        - {port: 5432, protocol: TCP}
    {{- end }}
{{- end }}
