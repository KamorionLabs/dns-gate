image:
  repository: ghcr.io/kamorionlabs/dns-gate
  tag: ""          # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# memory and sqlite stores support a single replica only (enforced).
replicaCount: 1

# Gate configuration, rendered as config.yaml (see docs/CONFIG.md).
# Secrets never go here: they come from the Secrets referenced below.
config:
  listen:
    address: ":8080"
  zones: []
  store:
    type: sqlite
    sqlite:
      path: /var/lib/dns-gate/gate.db
  issuers: []
  roles: {}
  bindings: []
  protected:
    - zones: ["*"]
      hosts: ["@"]
      types: [NS, SOA, MX, CAA]

# Existing Secret holding the EuroDNS credentials (keys below).
eurodns:
  existingSecret: ""
  appIdKey: app-id      # optional if config.upstream.app_id is set
  apiKeyKey: api-key

# Existing Secret for the UI login (when config.ui.enabled).
ui:
  existingSecret: ""
  sessionKeyKey: session-key     # 32 bytes, hex or base64
  clientSecretKey: ""           # key of the client secret; empty for a public client (PKCE)

# Existing Secret with the Postgres DSN (when config.store.type=postgres).
postgres:
  existingSecret: ""
  dsnKey: dsn

# Persistent volume for the sqlite store.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  mountPath: /var/lib/dns-gate

serviceAccount:
  create: true
  name: ""
  annotations: {}   # e.g. IRSA role for the dynamodb store
# Pod Identity / IRSA webhooks project their own token; the Kubernetes API
# token itself is not needed by the gate.
automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 80

networkPolicy:
  enabled: false
  # Sources allowed to reach the gate (NetworkPolicy "from" entries).
  ingressFrom: []
  # Egress: DNS plus HTTPS to these CIDRs (EuroDNS API, OIDC issuers,
  # AWS endpoints). Vanilla NetworkPolicy has no FQDN rules: use your CNI
  # (Cilium, Calico) for FQDN-based egress to rest-api.eurodns.com.
  egressCIDRs: ["0.0.0.0/0"]

podAnnotations: {}
podLabels: {}
resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 128Mi}
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
